<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cranes Daily Report — Site Detail</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <h1>CRANES DAILY REPORT</h1>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="site-detail.html">Site Detail</a>
    <a href="reports.html">Reports</a>
  </nav>
</header>

<main>
  <h2>Site Detail</h2>
  <p>
    Group:
    <select id="group"></select>
    Date: <input type="date" id="date">
    <button id="reload" class="secondary">Reload</button>
  </p>

  <h2>Device Downtime</h2>
  <table>
    <thead>
      <tr><th>Device</th><th>Active Hrs</th><th>Affected Hrs</th><th>Active %</th><th>Issue Occ.</th></tr>
    </thead>
    <tbody id="downtime"><tr><td colspan="5" class="muted">Pick a group.</td></tr></tbody>
  </table>

  <h2>Add Remark (site-level)</h2>
  <form class="stack" id="remarkForm">
    <textarea name="body" rows="2" placeholder="Remark for this site / date" required></textarea>
    <input name="author" placeholder="Author (optional)">
    <button>Save remark</button>
  </form>
  <div id="remarks"></div>

  <h2>Add PIC Follow-Up</h2>
  <form class="stack" id="followForm">
    <select name="device_id" id="followDevice"><option value="">— device (optional) —</option></select>
    <input name="issue" placeholder="Issue (e.g. CT_RHT_04 Inactive)" required>
    <textarea name="remark" rows="2" placeholder="Follow-up remark" required></textarea>
    <input name="assigned_pic" placeholder="Assigned PIC" required>
    <input type="date" name="date_assigned" required>
    <button>Save follow-up</button>
  </form>
  <div id="followups"></div>
</main>

<script src="assets/app.js"></script>
<script>
const dateInput = document.getElementById("date");
dateInput.value = qs("date") || today();
let groups = [];

async function loadGroups() {
  groups = await api("/groups");
  const sel = document.getElementById("group");
  sel.innerHTML = groups.map(g => `<option value="${g.id}">${g.name} (${g.device_count})</option>`).join("");
  if (qs("group")) sel.value = qs("group");
  await loadAll();
}

async function loadAll() {
  const gid = document.getElementById("group").value;
  const date = dateInput.value;
  if (!gid) return;

  const dt = await api(`/downtime/groups/${gid}?date=${date}`);
  document.getElementById("downtime").innerHTML = dt.devices.map(d => `
    <tr><td>${d.device}</td><td>${d.active_hours}</td><td>${d.affected_hours}</td>
    <td>${d.active_pct}%</td><td>${d.issue_occurrences}</td></tr>`).join("")
    || `<tr><td colspan="5" class="muted">No devices.</td></tr>`;

  const devSel = document.getElementById("followDevice");
  devSel.innerHTML = `<option value="">— device (optional) —</option>` +
    dt.devices.map(d => `<option value="${d.device_id}">${d.device}</option>`).join("");

  const remarks = await api(`/remarks?group_id=${gid}&report_date=${date}`);
  document.getElementById("remarks").innerHTML = remarks.map(r =>
    `<p>• ${r.body} <span class="muted">— ${r.author || "unattributed"}</span></p>`).join("")
    || `<p class="muted">No remarks.</p>`;

  const fus = await api(`/followups?group_id=${gid}&report_date=${date}`);
  document.getElementById("followups").innerHTML = fus.map(f =>
    `<p>• <strong>${f.issue}</strong>: ${f.remark} <span class="muted">→ ${f.assigned_pic} (${f.date_assigned})</span></p>`).join("")
    || `<p class="muted">No follow-ups.</p>`;
}

document.getElementById("reload").onclick = loadAll;
document.getElementById("group").onchange = loadAll;
dateInput.onchange = loadAll;

document.getElementById("remarkForm").onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  await api("/remarks", { method: "POST", body: JSON.stringify({
    group_id: +document.getElementById("group").value,
    report_date: dateInput.value,
    body: f.get("body"), author: f.get("author") || null,
  })});
  e.target.reset();
  toast("Remark saved");
  loadAll();
};

document.getElementById("followForm").onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  await api("/followups", { method: "POST", body: JSON.stringify({
    group_id: +document.getElementById("group").value,
    report_date: dateInput.value,
    device_id: f.get("device_id") ? +f.get("device_id") : null,
    issue: f.get("issue"), remark: f.get("remark"),
    assigned_pic: f.get("assigned_pic"), date_assigned: f.get("date_assigned"),
  })});
  e.target.reset();
  toast("Follow-up saved");
  loadAll();
};

loadGroups().catch(err => toast("Load failed: " + err.message));
</script>
</body>
</html>
