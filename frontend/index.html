<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cranes Daily Report — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <h1>CRANES DAILY REPORT</h1>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="site-detail.html">Site Detail</a>
    <a href="reports.html">Reports</a>
  </nav>
</header>

<main>
  <div id="banner" class="banner"></div>

  <div class="toolbar">
    <h2 style="margin:0">Today &middot; <span id="date"></span></h2>
    <div class="actions">
      <button id="import">Import data</button>
      <button id="poll" class="secondary">Poll statuses</button>
      <button id="report" class="secondary">Generate report</button>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div id="sites"><p class="muted">Loading…</p></div>
</main>

<script src="assets/app.js"></script>
<script>
const dateEl = document.getElementById("date");
let REPORT_DATE = today();

const fmtRun = (r) => r ? `${r.status} · ${r.ran_at.replace("T", " ").slice(0, 16)}` : "never";

async function loadBanner() {
  try {
    const s = await api("/status/last-run");
    const failed = (r) => r && r.status === "failed";
    const el = document.getElementById("banner");
    el.className = "banner" + (failed(s.last_capture) || failed(s.last_report) ? " bad"
                               : (s.last_capture ? " ok" : ""));
    el.innerHTML = `
      <span><b>Last capture</b> ${fmtRun(s.last_capture)}</span>
      <span><b>Last report</b> ${fmtRun(s.last_report)}</span>
      <span><b>Last poll</b> ${fmtRun(s.last_poll)}</span>
      <span><b>Next nightly</b> ${(s.next_runs.nightly || "—").replace("T", " ").slice(0, 16)}</span>`;
  } catch (e) { /* the banner is best-effort — never block the page on it */ }
}

function deviceRows(devices) {
  return devices.map(d => `
    <tr>
      <td>${d.device}</td>
      <td class="muted">${d.device_type || "—"}</td>
      <td>${pill(d.status)}</td>
      <td class="num">${d.active_hours.toFixed(1)}</td>
      <td class="num">${d.affected_hours.toFixed(1)}</td>
      <td class="num${d.issue_occurrences >= 5 ? " flag" : ""}">${d.issue_occurrences}</td>
    </tr>`).join("");
}

function siteBlock(group, devices) {
  const attention = devices.filter(d => d.severity !== "ok");
  const health = attention.some(d => d.severity === "bad") ? "ATTENTION" : "HEALTHY";
  // Only the devices that need looking at are shown up front. A site of 33 healthy
  // devices is one line, not 33 — the whole point of the dashboard is a glance.
  const shown = attention.length ? attention : [];
  const rest = devices.length - shown.length;

  return `
    <section class="site" data-group="${group.id}">
      <div class="site-head">
        <div>
          <a class="site-name" href="site-detail.html?group=${group.id}">${group.name}</a>
          ${pill(health)}
        </div>
        <div class="muted site-meta">
          ${devices.length} devices ·
          ${devices.filter(d => d.is_active).length} active ·
          ${attention.length} need attention
        </div>
      </div>
      ${shown.length ? `<table>
        <thead><tr>
          <th>Device</th><th>Type</th><th>Status</th>
          <th class="num">Active h</th><th class="num">Affected h</th><th class="num">Issues</th>
        </tr></thead>
        <tbody class="attention">${deviceRows(shown)}</tbody>
        <tbody class="all" hidden>${deviceRows(devices)}</tbody>
      </table>` : `<p class="all-clear">All ${devices.length} devices active.</p>`}
      ${rest > 0 ? `<button class="linkbtn" data-expand>Show all ${devices.length} devices</button>` : ""}
    </section>`;
}

async function load() {
  const sitesEl = document.getElementById("sites");
  const groups = await api("/groups");
  if (!groups.length) {
    sitesEl.innerHTML = `<p class="muted">No sites configured. Generate one with
      <code>python -m scripts.discover_device_groups --trigger &lt;name&gt; --name &lt;site&gt; --write</code>
      then reload the config.</p>`;
    document.getElementById("cards").innerHTML = "";
    return;
  }

  const summaries = await Promise.all(
    groups.map(g => api(`/downtime/groups/${g.id}?date=${REPORT_DATE}`).catch(() => ({ devices: [] })))
  );

  let devices = 0, active = 0, attention = 0;
  sitesEl.innerHTML = groups.map((g, i) => {
    const list = summaries[i].devices || [];
    devices += list.length;
    active += list.filter(d => d.is_active).length;
    attention += list.filter(d => d.severity !== "ok").length;
    return siteBlock(g, list);
  }).join("");

  document.getElementById("cards").innerHTML = `
    <div class="card"><div class="l">Sites</div><div class="v">${groups.length}</div></div>
    <div class="card"><div class="l">Devices</div><div class="v">${devices}</div></div>
    <div class="card"><div class="l">Active now</div><div class="v">${active}</div></div>
    <div class="card ${attention ? "alert" : ""}"><div class="l">Need attention</div>
      <div class="v">${attention}</div></div>`;

  sitesEl.querySelectorAll("[data-expand]").forEach(btn => {
    btn.onclick = () => {
      const table = btn.closest(".site").querySelector("table");
      const showingAll = !table.querySelector("tbody.all").hidden;
      table.querySelector("tbody.all").hidden = showingAll;
      table.querySelector("tbody.attention").hidden = !showingAll;
      btn.textContent = showingAll
        ? `Show all ${table.querySelectorAll("tbody.all tr").length} devices`
        : "Show only devices needing attention";
    };
  });
}

function wire(id, path, message) {
  document.getElementById(id).onclick = async (e) => {
    e.target.disabled = true;
    const label = e.target.textContent;
    e.target.textContent = "Working…";
    try {
      toast(message(await api(path(), { method: "POST" })));
      await Promise.all([load(), loadBanner()]);
    } catch (err) { toast("Failed: " + err.message); }
    e.target.textContent = label;
    e.target.disabled = false;
  };
}

wire("import", () => "/captures/run",
     r => `Snapshot taken: ${r.values} values across ${r.devices} devices`);
wire("poll", () => "/downtime/poll",
     r => `Polled ${r.polled} devices, ${r.changes} status change(s)`);
wire("report", () => `/reports/${REPORT_DATE}/generate`,
     r => r.status === "generated" ? `Report generated for ${r.date}` : `Failed: ${r.error}`);

dateEl.textContent = REPORT_DATE;
loadBanner();
load().catch(err => {
  document.getElementById("sites").innerHTML =
    `<p class="muted">Could not load: ${err.message}</p>`;
});
</script>
</body>
</html>
