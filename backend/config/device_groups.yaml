# ─────────────────────────────────────────────────────────────────────────────
# Cranes Daily Report — the 22 device / alarm / trigger groups.
#
# DO NOT hand-transcribe the 22 lists. Generate this file by walking the
# ThingsBoard API once credentials are in .env:
#
#     python -m scripts.discover_device_groups --write
#
# Then review it and adjust: site_label, system_type, per-key `role`
# (exactly one key per device must be role: status), and `unit`.
#
# On startup the backend mirrors this file into the device_groups / devices /
# device_keys tables. It is the source of truth for config — edit the file,
# restart (or POST /api/config/reload), don't edit the DB directly.
#
# For OFFLINE work (no ThingsBoard yet) don't use this file — load the sample
# instead:  python -m scripts.load_seed --report   (see CLAUDE.md guardrails).
# ─────────────────────────────────────────────────────────────────────────────

# Used for any device whose keys don't explicitly mark one as role: status.
# Confirmed decision: status always comes from the sensor's own reported status
# telemetry key, uniformly across all 22 groups.
status_key_default: status

# Empty until the discover script is run — keeps startup config-sync a no-op.
groups: []

