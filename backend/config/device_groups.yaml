# ─────────────────────────────────────────────────────────────────────────────
# Shared config defaults. THE SITES THEMSELVES LIVE IN backend/config/sites/ —
# one file per site, e.g. sites/numed.yaml. Generate them, don't hand-type:
#
#     python -m scripts.discover_device_groups --list-triggers
#     python -m scripts.discover_device_groups --trigger NumedTrigger --name NUMed --write
#
# On startup (and on POST /api/config/reload) the backend merges this file with
# every sites/*.yaml and mirrors the result into the device_groups / devices /
# device_keys tables. Sites are ordered by `sort_order` when set, else by file name.
#
# A `groups:` list left inline here still loads, so an older single-file config keeps
# working — but a site with its own file in sites/ wins on name. New sites go in
# sites/, not here.
#
# For OFFLINE work (no ThingsBoard yet) don't use this at all — load the sample
# instead:  python -m scripts.load_seed --report   (see CLAUDE.md guardrails).
# ─────────────────────────────────────────────────────────────────────────────

# Used for any device whose keys don't explicitly mark one as role: status.
status_key_default: status

# Sites live in sites/*.yaml. Keep this empty.
groups: []
